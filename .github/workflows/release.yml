name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web-resources/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Install Power Platform CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version 2.12.2
      - name: Build web resources
        working-directory: src/web-resources
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Check versions match the tag
        run: |
          node scripts/check-version.mjs
          test "v$(node -p "require('./src/web-resources/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Pack solution
        run: |
          node scripts/sync-webresources.mjs
          mkdir -p out
          pac solution pack --zipfile out/FormUpdateReplay_${GITHUB_REF_NAME}_unmanaged.zip --folder src/solution --packagetype Unmanaged
          pac solution pack --zipfile out/FormUpdateReplay_${GITHUB_REF_NAME}_managed.zip --folder src/solution --packagetype Managed
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*.zip
          generate_release_notes: true
